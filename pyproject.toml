[project]
name = "gami2-map"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=4.1.1",
    "fasttext>=0.9.3",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "huggingface-hub>=2.1.1",
    "matplotlib>=3.11.2",
    "mkdocs-material>=9.7.7",
    "nacsos-data",
    "nltk>=3.10.3",
    "optuna>=5.0.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "rdflib>=7.6.0",
    "scikit-learn>=1.9.1",
    "setfit>=1.2.0",
    "tool>=0.8.0",
    "typer>=0.27.0",
]

[project.scripts]
build-labels = "gami2_map.data.labels:main"
train-transformer = "gami2_map.models.transformer_model:main"
train-setfit = "gami2_map.models.setfit_model:main"
train-classical = "gami2_map.models.classical_model:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
nacsos-data = { git = "ssh://git@gitlab.pik-potsdam.de/mcc-apsis/nacsos/nacsos-data.git" }

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
